<style>
/* Layout: coluna única de app de celular, abas fixas embaixo, formulários em folha deslizante */
:root{
 --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
 --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
 --ground:#e3e9df;--bg:#f4f6f1;--surface:#ffffff;--surface2:#eaefe6;--ink:#17231b;--muted:#566559;--line:#d6ddd1;
 --green:#1d6b43;--on-green:#ffffff;--green-soft:#d9eadf;
 --ochre:#8f5e06;--ochre-soft:#f5e6c3;
 --bad:#a8322a;--bad-soft:#f5dcd8;
 --c1:#2f7a54;--c2:#c8901a;--c3:#4a6f8a;--c4:#a5502d;--c5:#7a5a86;--c6:#2b8a8a;--c7:#8b958d;--c8:#b04f7c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --ground:#0b100d;--bg:#121a14;--surface:#1a241d;--surface2:#222e25;--ink:#e8efe9;--muted:#9fb0a4;--line:#2e3c32;
 --green:#4fb882;--on-green:#0b1a11;--green-soft:#1d3a2a;--ochre:#e2b34f;--ochre-soft:#3a2f14;--bad:#ef8a80;--bad-soft:#40201d;
 --c1:#54b887;--c2:#e2b34f;--c3:#7fa6c4;--c4:#d98a63;--c5:#b496c2;--c6:#55b9b9;--c7:#a4afa6;--c8:#d98fb0;color-scheme:dark}}
:root[data-theme="dark"]{
 --ground:#0b100d;--bg:#121a14;--surface:#1a241d;--surface2:#222e25;--ink:#e8efe9;--muted:#9fb0a4;--line:#2e3c32;
 --green:#4fb882;--on-green:#0b1a11;--green-soft:#1d3a2a;--ochre:#e2b34f;--ochre-soft:#3a2f14;--bad:#ef8a80;--bad-soft:#40201d;
 --c1:#54b887;--c2:#e2b34f;--c3:#7fa6c4;--c4:#d98a63;--c5:#b496c2;--c6:#55b9b9;--c7:#a4afa6;--c8:#d98fb0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:440px;min-height:100%;margin:0 auto;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
@media(min-width:480px){.app{border-inline:1px solid var(--line)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 0 10px}
h1{font:700 26px/1.1 var(--display);letter-spacing:-.015em;margin:3px 0 0;text-wrap:balance}
h2{font:700 18px/1.2 var(--display);letter-spacing:-.01em;margin:0}
h3{font:700 17px/1.2 var(--display);margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rolebtn{min-height:44px;padding:4px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-align:right;line-height:1.15}
.rolebtn small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.rolebtn b{font-size:14px}
.sec{margin-top:22px}.sec>h2{margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.stack>*{min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2>*{min-width:0}.grid2 select,.grid2 input{width:100%;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.l{font-size:12px;color:var(--muted);font-weight:600}
.v{font:700 22px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.s{font-size:12px;color:var(--muted);margin-top:2px}
.muted{color:var(--muted)}.small{font-size:13px}
.hero{background:var(--green);color:var(--on-green);border-radius:18px;padding:18px}
.hero .eyebrow{color:inherit;opacity:.85}
.hero .big{font:800 40px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.hero .note{font-size:12px;opacity:.8;margin-top:10px}
.chipw{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:14px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{justify-content:flex-start;min-height:56px;font-size:15px}
.qa svg{color:var(--green);flex:none}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;overflow-x:auto;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--ochre-soft);color:var(--ochre)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.list{display:grid}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.list>.row:first-child{border-top:0}
.row b{font:700 18px/1.2 var(--display)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;display:grid;gap:4px;justify-items:end}
.alert{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:48px}
.list>.alert:first-child{border-top:0}
.alert i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ochre)}
.alert.bad i{background:var(--bad)}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 10px}
.stackbar span{display:block;min-width:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.hb{margin:12px 0}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb-top b{font-variant-numeric:tabular-nums}
.hb-track{height:10px;background:var(--surface2);border-radius:5px;margin-top:6px;overflow:hidden}
.hb-fill{height:100%;border-radius:5px}
.t{fill:var(--muted);font-size:10px;font-family:var(--body)}
.tv{fill:var(--ink);font-size:10.5px;font-weight:700;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.verdict{border-radius:12px;padding:12px 14px;display:grid;gap:2px;margin-bottom:12px}
.verdict.good{background:var(--green-soft);color:var(--green)}
.verdict.warn{background:var(--ochre-soft);color:var(--ochre)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict b{font:700 18px/1.2 var(--display)}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.rows>div:first-child{border-top:0}
.rows dd,.rows dt{margin:0}
.rows dd{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rows .total{font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.search{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.inp{position:relative}.inp input{padding-right:48px}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;margin-top:4px;min-height:0}
.search{margin-bottom:10px}
.stock{grid-template-columns:1fr auto;row-gap:8px}
.step{display:flex;gap:6px;grid-column:1/-1;justify-content:space-between;align-items:center}
.step .btns{display:flex;gap:6px}
.step button{width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.qty{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}.qty small{font:500 13px var(--body);color:var(--muted)}
.ad .tipo{margin-bottom:6px}
.ad .price{font:800 22px/1.1 var(--display);color:var(--green);margin:6px 0}
ol.steps{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex}
.nav button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;border-radius:10px}
.nav button[aria-current=page]{color:var(--green)}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,440px);max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92%,420px);text-align:center}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

[hidden]{display:none!important}
.inp input{width:100%;min-height:48px;padding:0 48px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:24px}
a.btn{text-decoration:none;color:inherit}
a.btn.p{color:var(--on-green)}
.banner{background:var(--ochre-soft);color:var(--ochre);font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:8px}
.btn:disabled{opacity:.6;cursor:default}
.linkbtn.muted{color:var(--muted)}
.linkbtn.small{font-size:13px}
.nav button{position:relative}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--body);font-style:normal;padding:0 5px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;color:var(--muted);text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
.tbl td{padding:8px 10px 8px 0;border-top:1px solid var(--line);white-space:nowrap}
.linkbtn.ul{text-decoration:underline;color:var(--green)}
#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;animation:splashOut .45s ease 3s forwards}
#splash img{width:min(78vw,420px);height:auto;aspect-ratio:1;animation:splashIn .6s ease both}
@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
/* ---------- Notebook / telas largas: menu lateral, conteúdo largo, folhas viram janela ---------- */
@media(min-width:760px) and (max-width:999px){
 .app{max-width:720px}.nav{width:min(100%,720px)}
 .stack{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
 svg[role=img]{max-width:520px}
 .sheet-wrap{align-items:center}.sheet{width:min(100%,520px);border-radius:18px}
}
@media(min-width:1000px){
 body{background:var(--bg)}
 .app{max-width:none;border:0!important;padding:0 40px 48px 264px}
 .top{max-width:1240px;margin-inline:auto;padding:22px 0 14px}
 #main,.banner{max-width:1240px;margin-inline:auto}
 h1{font-size:30px}
 .nav{left:0;top:0;bottom:0;transform:none;width:224px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 16px;background:var(--surface)}
 .nav::before{content:"AIMEX Agro";position:absolute;top:24px;left:20px;font:800 19px/1 var(--display);color:var(--green);letter-spacing:-.01em}
 .nav::after{content:"Meu Rebanho";position:absolute;top:50px;left:20px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
 .nav button{flex:none;min-height:48px;grid-auto-flow:column;grid-template-columns:auto 1fr;justify-items:start;align-content:center;align-items:center;gap:12px;padding:0 14px;font-size:15px;border-radius:10px;text-align:left}
 .nav button:hover{background:var(--surface2)}
 .nav button[aria-current=page]{background:var(--green-soft)}
 .badge{top:50%;transform:translateY(-50%);left:auto;right:12px}
 .stack{grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
 .stack>.verdict{grid-column:1/-1}
 .grid3{gap:14px}
 .qa{grid-template-columns:repeat(4,1fr)}
 .row2{max-width:560px}
 .seg{display:inline-flex;max-width:100%}.seg button{flex:none;min-width:130px}
 .card{padding:18px}
 .hero{padding:24px}.hero .big{font-size:48px}
 svg[role=img]{max-width:620px}
 .sheet-wrap{align-items:center}
 .sheet{width:min(100%,560px);border-radius:18px;max-height:88%;padding:22px 24px}
 .toast{bottom:28px}
 .search{max-width:420px}
 .tbl{font-size:14px}
 .field input,.field select,.search,.inp input{min-height:44px}
}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 78px 32px;gap:6px;align-items:center;margin-bottom:6px}.prow .inp{min-width:0}.prow .inp input{width:100%;min-width:0}.prow.ph{font-size:12px;color:var(--mut,#667);margin-bottom:2px}.prow.ph span:last-child{display:none}.prow.ph{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 78px 32px}.pcalc{font-size:12px;text-align:right;white-space:nowrap}.prow .x.sm{width:32px;height:32px;padding:0;display:grid;place-items:center}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:420px){.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}.pcalc{display:none}.prow.ph span:nth-child(3){display:none}.prow.ph{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}}</style>
</head>

function nice(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

function lineChart(pts,label,opt){
 opt=opt||{};var W=340,H=190,L=opt.L||36,Rr=16,T=18,B=26;
 var ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
 if(mn===mx){mn-=1;mx+=1}
 var step=nice((mx-mn)*1.2/4);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
 var x=function(i){return L+(pts.length===1?(W-L-Rr)/2:i*(W-L-Rr)/(pts.length-1))};
 var y=function(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B)};
 var s=svgOpen(W,H,label),v;
 for(v=mn;v<=mx+1e-9;v+=step){s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text class="t" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(opt.fmt?opt.fmt(v):num(v,step%1?1:0))+'</text>'}
 var d=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)}).join(' ');
 s+='<path d="'+d+' L'+x(pts.length-1)+' '+(H-B)+' L'+x(0)+' '+(H-B)+' Z" fill="var(--c1)" opacity=".13"/>';
 s+='<path d="'+d+'" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
 pts.forEach(function(p,i){
  var k=pts.length>7?Math.ceil(pts.length/6):1;
  if(i%k===0||i===pts.length-1)s+='<text class="t" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+(p.l||fdm(p.d))+'</text>';
  s+='<circle cx="'+x(i)+'" cy="'+y(p.y)+'" r="'+(i===pts.length-1?5:3)+'" fill="var(--surface)" stroke="var(--c1)" stroke-width="2"/>';

 return s+'</svg>';
}

 var s=svgOpen(W,H,label)+'<line x1="'+L+'" x2="'+(W-L)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
 items.forEach(function(it,i){
  var x=L+i*step+(step-bw)/2,hv=it.v/mx*(H-T-B),hp=(it.p||0)/mx*(H-T-B),y=H-B-hv-hp;
  if(it.v)s+='<rect x="'+x+'" y="'+(H-B-hv)+'" width="'+bw+'" height="'+hv+'" rx="3" fill="var(--c1)"/>';
  if(it.p)s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hp+'" rx="3" fill="var(--c1)" fill-opacity=".22" stroke="var(--c1)" stroke-dasharray="3 2"/>';

  s+='<text class="t" x="'+(x+bw/2)+'" y="'+(H-B+13)+'" text-anchor="middle">'+it.l+'</text>';
  if(it.yr)s+='<text class="t" x="'+(x+bw/2)+'" y="'+(H-B+25)+'" text-anchor="middle">'+it.yr+'</text>';
 });

function groupBars(data,label){
 var W=340,H=200,L=40,Rr=6,T=12,B=26,n=data.length,slot=(W-L-Rr)/n,bw=slot*.34;

 var step=nice(mx/4);mx=Math.ceil(mx/step)*step;

 for(v=0;v<=mx+1e-9;v+=step)s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text class="t" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+(v?num(v/1000)+' mil':'0')+'</text>';

}

/* ---------- simulador de cria e painel de patrimônio ---------- */
var DM=30.4375,GEST=283,REND_MATRIZ=.48,GMD_NOVILHA=.5,PESO_NASC=32;
function addMonthsD(s,n){var y=+s.slice(0,4),m=+s.slice(5,7)-1+n,d=+s.slice(8,10);y+=Math.floor(m/12);m=((m%12)+12)%12;var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+p2(m+1)+'-'+p2(Math.min(d,last))}
var sumA=function(a){return a.reduce(function(s,x){return s+x},0)};

/* Simula mês a mês: compra das matrizes, estação de monta de cada ano, partos (283 dias),
   desmama e venda dos bezerros, novilhas retidas que viram matrizes, custos e estoque final. */
function criaSim(p){
 var N=Math.max(1,Math.min(10,Math.round(p.anos))),ini=p.inicio||TODAY,fim=addMonthsD(ini,12*N);
 var desmD=Math.round(p.desm*DM),idadeD=Math.round(p.idade1*DM),meio=Math.round(p.estacao/2);
 var gmdB=(p.pesoDesm-PESO_NASC)/Math.max(1,desmD);
 var R={N:N,ini:ini,fim:fim,coh:[],Ms:[],est:[],porAno:[],anos:[],tot:{compra:p.qtd*p.precoVaca,insem:0,manut:0,mineral:0,sanid:0,venda:0,mineralKg:0,compraNova:0},buy:[]};
 var M=p.qtd,k,m,y;
 for(y=0;y<N;y++)R.porAno.push({ent:0,sai:0});
 R.porAno[0].sai+=R.tot.compra;
 for(k=0;k<N;k++){
  var d0=addMonthsD(ini,12*k);
  if(k>0)M*=1-p.mortMat/100;
  R.coh.forEach(function(c){if(!c.join&&c.ret>0&&dd(c.nasc,d0)>=idadeD){c.join=d0;M+=c.ret}});
  var buy=0;
  if(p.modo==='comprar'){R.coh.forEach(function(c){if(!c.bought&&c.desm<=d0){c.bought=1;c.nBuy=Math.floor(c.venda0*p.pctReinv/100/p.precoVaca);buy+=c.nBuy}});
   M+=buy;var cb=buy*p.precoVaca;R.tot.compraNova+=cb;R.porAno[k].sai+=cb}
  R.buy.push(buy);
  var E=M,P=E*p.taxa/100,B=P*(1-p.mortBez/100),nasc=addDays(d0,GEST+meio),desm=addDays(nasc,desmD);
  var c={k:k,est:d0,E:E,P:P,B:B,nasc:nasc,desm:desm,pIni:addDays(d0,GEST),pFim:addDays(d0,GEST+p.estacao),mach:B/2,fem:B/2,ret:0,vendF:0,join:null};
  if(p.modo==='reter'){c.ret=c.fem*p.pctRet/100;c.vendF=c.fem-c.ret}else c.vendF=c.fem;
  c.venda0=(c.mach*p.pkM+c.vendF*p.pkF)*p.pesoDesm;
  R.coh.push(c);R.Ms.push(M);R.est.push(d0);
  var ci=E*p.custoInsem;R.tot.insem+=ci;R.porAno[k].sai+=ci;
 }
 var snap=function(date){var H=0,CF=0;
  R.coh.forEach(function(c){if(c.nasc<=date&&date<c.desm)CF+=c.B;if(c.ret>0&&c.desm<=date&&!(c.join&&c.join<=date))H+=c.ret});
  return {H:H,CF:CF}};
 R.snap=snap;
 for(m=0;m<12*N;m++){
  var dm=addMonthsD(ini,m),s=snap(dm),Mm=R.Ms[Math.floor(m/12)];y=Math.floor(m/12);
  var man=(Mm+s.H)*p.custoMes,kg=((Mm+s.H)*p.gVaca+s.CF*p.gBez)/1000*DM,mi=kg*p.pkMin;
  R.tot.manut+=man;R.tot.mineral+=mi;R.tot.mineralKg+=kg;R.porAno[y].sai+=man+mi;
 }
 R.coh.forEach(function(c){
  var yb=Math.min(N-1,Math.floor(dd(ini,c.nasc)/365.25));
  if(c.nasc<=fim){var cs=c.B*p.sanBez;R.tot.sanid+=cs;R.porAno[yb].sai+=cs}
  if(c.desm<=fim){
   var v=c.mach*p.pesoDesm*p.pkM+c.vendF*p.pesoDesm*p.pkF,ys=Math.min(N-1,Math.floor(dd(ini,c.desm)/365.25));
   c.venda=v;c.vendido=c.mach+c.vendF;R.tot.venda+=v;R.porAno[ys].ent+=v;
  }else{c.venda=0;c.vendido=0}
 });
 R.custo=R.tot.compra+R.tot.compraNova+R.tot.insem+R.tot.manut+R.tot.mineral+R.tot.sanid;
 for(y=0;y<N;y++){var de=addDays(addMonthsD(ini,12*(y+1)),-1),s2=snap(de);R.anos.push({l:'Ano '+(y+1),M:R.Ms[y],H:s2.H,CF:s2.CF})}
 var sf=snap(fim);
 R.fim_={M:R.Ms[N-1],H:sf.H,CF:sf.CF};
 R.finH=[];R.finCF=[];
 R.coh.forEach(function(c){
  if(c.ret>0&&c.desm<=fim&&!(c.join&&c.join<=fim))R.finH.push({n:c.ret,w:Math.min(p.pesoMat,p.pesoDesm+GMD_NOVILHA*dd(c.desm,fim))});
  if(c.nasc<=fim&&fim<c.desm)R.finCF.push({n:c.B,w:PESO_NASC+gmdB*dd(c.nasc,fim)});
 });
 R.valor=function(f){
  var ar=p.arroba*f,pm=(p.pkM+p.pkF)/2*f,a=REND_MATRIZ/15*ar;
  return R.fim_.M*p.pesoMat*a+sumA(R.finH.map(function(x){return x.n*x.w*a}))+sumA(R.finCF.map(function(x){return x.n*x.w*pm}));
 };
 R.cen=[.9,1,1.1].map(function(f){var v=R.valor(f),l=R.tot.venda+v-R.custo;return {f:f,ar:p.arroba*f,valor:v,lucro:l,roi:R.custo?l/R.custo:0}});
 return R;
}

function stackChart(items,cols,label){
 var W=340,H=210,L=40,Rr=6,T=16,B=26,n=items.length,slot=(W-L-Rr)/n,bw=Math.min(44,slot*.62);
 var mx=Math.max.apply(null,items.map(function(i){return sumA(i.v)}))||1,step=nice(mx/4),v;mx=Math.ceil(mx/step)*step;
 var y=function(a){return T+(1-a/mx)*(H-T-B)};
 var s=svgOpen(W,H,label);
 for(v=0;v<=mx+1e-9;v+=step)s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text class="t" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+num(v)+'</text>';
 items.forEach(function(it,i){
  var x=L+i*slot+(slot-bw)/2,acc=0;
  it.v.forEach(function(a,j){if(a<=0)return;s+='<rect x="'+x+'" y="'+y(acc+a)+'" width="'+bw+'" height="'+(y(acc)-y(acc+a))+'" fill="var('+cols[j]+')"/>';acc+=a});
  s+='<text class="tv" x="'+(x+bw/2)+'" y="'+(y(acc)-4)+'" text-anchor="middle">'+num(acc)+'</text><text class="t" x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+it.l+'</text>';
 });
 return s+'</svg>';
}

var parseNum=function(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))};
function parseTabela(txt){

  var n=(l.match(/\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?/g)||[]).map(parseNum),kg,p;
  if(n.length>=5){kg=n[0];p=n[2]}else if(n.length===2){kg=n[0];p=n[1]}else return;

}

   if(S.stage!=='pend'){stopData();S.perfil=null;S.stage='pend';render()}
   return;
  }

   else if(isAdmin()){S.stage='adm';startAdmin();render()}
   else{S.stage='onb';render()}
